<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#02030a" />
<title>JARVIS // Afflatus Command Nexus</title>

<style>
:root {
  --bg: #02030a;
  --panel: rgba(8, 13, 30, .58);
  --panel2: rgba(12, 21, 45, .72);
  --cyan: #55f6ff;
  --blue: #4c7dff;
  --violet: #a855f7;
  --pink: #ff4fd8;
  --green: #55ffb0;
  --gold: #ffd76a;
  --text: #eef8ff;
  --muted: #7190ae;
  --danger: #ff5277;
  --border: rgba(117, 221, 255, .16);
  --shadow: 0 0 70px rgba(55, 170, 255, .12);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 40%, rgba(64, 99, 255, .12), transparent 30%),
    radial-gradient(circle at 15% 20%, rgba(0, 255, 255, .07), transparent 25%),
    radial-gradient(circle at 85% 70%, rgba(190, 0, 255, .08), transparent 25%),
    #02030a;
}

/* ---------- MAGIC BACKGROUND ---------- */

#universe {
  position: fixed;
  inset: 0;
  z-index: -5;
}

.noise {
  position: fixed;
  inset: 0;
  z-index: -3;
  opacity: .035;
  pointer-events: none;
  background-image:
    repeating-radial-gradient(
      circle at 0 0,
      transparent 0,
      rgba(255,255,255,.4) 1px,
      transparent 2px
    );
  background-size: 7px 7px;
}

.grid {
  position: fixed;
  inset: -50%;
  z-index: -4;
  opacity: .18;
  background-image:
    linear-gradient(rgba(75, 239, 255, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(75, 239, 255, .08) 1px, transparent 1px);
  background-size: 70px 70px;
  transform: perspective(650px) rotateX(62deg) translateY(30%);
  animation: gridMove 14s linear infinite;
}

@keyframes gridMove {
  from { transform: perspective(650px) rotateX(62deg) translateY(30%); }
  to   { transform: perspective(650px) rotateX(62deg) translateY(35%); }
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(80,240,255,.5) 0 1px, transparent 1.5px);
  background-size: 97px 113px, 173px 191px;
  animation: starDrift 35s linear infinite;
  opacity: .28;
}

@keyframes starDrift {
  to { transform: translate3d(-120px, 100px, 0); }
}

/* ---------- APP ---------- */

.app {
  width: min(1500px, 100%);
  min-height: 100vh;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
}

/* ---------- HEADER ---------- */

.header {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: rgba(4, 8, 19, .55);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  position: relative;
  background:
    conic-gradient(
      from 0deg,
      var(--cyan),
      var(--violet),
      var(--pink),
      var(--cyan)
    );
  animation: spin 5s linear infinite;
  box-shadow:
    0 0 20px rgba(85,246,255,.45),
    0 0 60px rgba(168,85,247,.2);
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: inherit;
  background: #050814;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.brand h1 {
  margin: 0;
  font-size: 16px;
  letter-spacing: .22em;
  font-weight: 800;
}

.brand span {
  display: block;
  color: var(--cyan);
  font-size: 10px;
  letter-spacing: .18em;
  margin-top: 4px;
}

.system {
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 15px var(--green);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.5);
    opacity: .45;
  }
}

/* ---------- MAIN ---------- */

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 16px;
  min-height: 0;
}

.hero {
  position: relative;
  min-height: 620px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 30px;
  background:
    radial-gradient(circle at 50% 48%, rgba(70, 180, 255, .1), transparent 24%),
    linear-gradient(145deg, rgba(9,15,34,.75), rgba(3,6,15,.72));
  backdrop-filter: blur(20px);
  box-shadow:
    inset 0 0 80px rgba(77, 219, 255, .025),
    var(--shadow);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(85,246,255,.035),
      transparent
    );
  animation: scan 5s ease-in-out infinite;
}

@keyframes scan {
  0%,100% { transform: translateX(-100%); }
  50% { transform: translateX(100%); }
}

/* ---------- ORB ---------- */

.orb-stage {
  position: absolute;
  inset: 50% auto auto 50%;
  width: min(54vw, 500px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
}

.orb {
  position: relative;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 40% 34%,
      #ffffff 0%,
      #bafcff 3%,
      #51e8ff 12%,
      #1678ff 31%,
      #4322ba 56%,
      #070817 75%
    );
  box-shadow:
    0 0 25px #55f6ff,
    0 0 70px rgba(0, 181, 255, .7),
    0 0 150px rgba(129, 67, 255, .35),
    inset -25px -25px 60px rgba(0,0,0,.65),
    inset 10px 10px 35px rgba(255,255,255,.3);
  animation: orbFloat 4s ease-in-out infinite;
  cursor: pointer;
}

@keyframes orbFloat {
  0%,100% {
    transform: translateY(-8px) scale(1);
  }
  50% {
    transform: translateY(8px) scale(1.035);
  }
}

.orb::before,
.orb::after {
  content: "";
  position: absolute;
  inset: -25px;
  border: 1px solid rgba(85,246,255,.28);
  border-radius: 50%;
  transform: rotate(20deg) scaleX(.65);
  box-shadow: 0 0 30px rgba(85,246,255,.15);
}

.orb::after {
  inset: -50px;
  border-color: rgba(168,85,247,.25);
  transform: rotate(-30deg) scaleY(.55);
}

.orbit {
  position: absolute;
  border: 1px solid rgba(85,246,255,.22);
  border-radius: 50%;
  pointer-events: none;
}

.o1 {
  width: 330px;
  height: 110px;
  transform: rotate(25deg);
  animation: orbit1 6s linear infinite;
}

.o2 {
  width: 400px;
  height: 160px;
  transform: rotate(-40deg);
  animation: orbit2 8s linear infinite reverse;
  border-color: rgba(168,85,247,.25);
}

.o3 {
  width: 480px;
  height: 210px;
  transform: rotate(70deg);
  animation: orbit3 11s linear infinite;
  border-color: rgba(255,79,216,.16);
}

@keyframes orbit1 {
  to { transform: rotate(385deg); }
}

@keyframes orbit2 {
  to { transform: rotate(320deg); }
}

@keyframes orbit3 {
  to { transform: rotate(430deg); }
}

.orb-listening .orb {
  animation:
    orbFloat 2s ease-in-out infinite,
    listeningPulse .7s ease-in-out infinite alternate;
}

@keyframes listeningPulse {
  to {
    box-shadow:
      0 0 35px var(--cyan),
      0 0 110px var(--cyan),
      0 0 200px var(--violet),
      inset -25px -25px 60px rgba(0,0,0,.65);
  }
}

.voice-label {
  position: absolute;
  top: calc(50% + 145px);
  left: 0;
  right: 0;
  text-align: center;
  letter-spacing: .25em;
  font-size: 11px;
  color: var(--cyan);
  text-transform: uppercase;
}

/* ---------- TERMINAL ---------- */

.terminal {
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 24px;
  padding: 14px 16px;
  border: 1px solid rgba(85,246,255,.15);
  border-radius: 18px;
  background: rgba(0,0,0,.36);
  backdrop-filter: blur(16px);
}

.terminal-line {
  color: var(--muted);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11px;
  margin-bottom: 8px;
}

.terminal-line strong {
  color: var(--green);
}

.command-form {
  display: flex;
  gap: 10px;
}

.command-input {
  min-width: 0;
  flex: 1;
  color: white;
  background: transparent;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: 14px;
}

.command-input::placeholder {
  color: #45627f;
}

.icon-btn,
.execute-btn {
  border: 1px solid rgba(85,246,255,.25);
  background: rgba(85,246,255,.06);
  color: var(--cyan);
  border-radius: 12px;
  cursor: pointer;
  transition: .25s;
}

.icon-btn {
  width: 42px;
  height: 42px;
}

.execute-btn {
  padding: 0 17px;
  font-weight: 700;
}

.icon-btn:hover,
.execute-btn:hover {
  transform: translateY(-2px);
  background: rgba(85,246,255,.13);
  box-shadow: 0 0 25px rgba(85,246,255,.15);
}

/* ---------- SIDEBAR ---------- */

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

.card {
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
  padding: 18px;
}

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
  color: #c9eaff;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .18em;
}

.card-title span {
  color: var(--cyan);
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.quick {
  min-height: 74px;
  padding: 12px;
  text-align: left;
  color: #c9d8e8;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 15px;
  cursor: pointer;
  transition: .25s;
}

.quick:hover {
  transform: translateY(-3px);
  border-color: rgba(85,246,255,.35);
  background: rgba(85,246,255,.055);
}

.quick b {
  display: block;
  color: var(--cyan);
  margin-bottom: 6px;
  font-size: 12px;
}

.quick small {
  color: var(--muted);
}

/* ---------- HISTORY ---------- */

.history {
  flex: 1;
  min-height: 220px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.log {
  overflow-y: auto;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.log::-webkit-scrollbar {
  width: 4px;
}

.log::-webkit-scrollbar-thumb {
  background: rgba(85,246,255,.2);
  border-radius: 10px;
}

.log-item {
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,.025);
  border-left: 2px solid var(--cyan);
  animation: enter .35s ease;
}

.log-item.user {
  border-left-color: var(--violet);
}

.log-item.success {
  border-left-color: var(--green);
}

.log-item.error {
  border-left-color: var(--danger);
}

.log-meta {
  color: #4d6b88;
  font-size: 9px;
  margin-bottom: 4px;
  letter-spacing: .1em;
}

.log-text {
  color: #c8d9e9;
  font-size: 12px;
  line-height: 1.5;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

/* ---------- FOOTER ---------- */

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  color: #48647f;
  font-size: 10px;
}

.footer b {
  color: #7798b5;
}

.badges {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.badge {
  padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 999px;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 980px) {
  .main {
    grid-template-columns: 1fr;
  }

  .hero {
    min-height: 650px;
  }

  .sidebar {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .history {
    grid-column: span 2;
  }
}

@media (max-width: 650px) {
  .app {
    padding: 10px;
  }

  .header {
    border-radius: 18px;
  }

  .system {
    display: none;
  }

  .hero {
    min-height: 620px;
    border-radius: 22px;
  }

  .orb-stage {
    width: 100vw;
  }

  .orb {
    width: 145px;
    height: 145px;
  }

  .o1 { width: 270px; }
  .o2 { width: 320px; }
  .o3 { width: 370px; }

  .voice-label {
    top: calc(50% + 120px);
  }

  .terminal {
    left: 12px;
    right: 12px;
    bottom: 12px;
  }

  .sidebar {
    display: flex;
  }

  .history {
    min-height: 260px;
  }

  .footer {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<canvas id="universe"></canvas>
<div class="stars"></div>
<div class="grid"></div>
<div class="noise"></div>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>AFFLATUS // JARVIS</h1>
        <span>OMNIDIRECTIONAL COMMAND NEXUS</span>
      </div>
    </div>

    <div class="system">
      <i class="pulse-dot"></i>
      <span id="systemStatus">SYSTEM ONLINE</span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- HERO -->
    <section class="hero" id="hero">

      <div class="orb-stage" id="orbStage">
        <div class="orbit o1"></div>
        <div class="orbit o2"></div>
        <div class="orbit o3"></div>

        <div class="orb" id="orb" title="Click to speak"></div>

        <div class="voice-label" id="voiceLabel">
          CLICK OR SAY "JARVIS"
        </div>
      </div>

      <div class="terminal">
        <div class="terminal-line">
          <strong>JARVIS:</strong>
          <span id="response">Awaiting your command...</span>
        </div>

        <form class="command-form" id="commandForm">
          <button
            class="icon-btn"
            type="button"
            id="micBtn"
            title="Voice command"
          >◉</button>

          <input
            id="commandInput"
            class="command-input"
            autocomplete="off"
            placeholder="Command anything... e.g. 'open YouTube'"
          />

          <button class="execute-btn" type="submit">
            EXECUTE
          </button>
        </form>
      </div>

    </section>

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <section class="card">
        <div class="card-title">
          <span>Quick Nexus</span>
          <span>∞</span>
        </div>

        <div class="quick-grid">

          <button class="quick" data-command="What time is it?">
            <b>TIME</b>
            <small>Temporal status</small>
          </button>

          <button class="quick" data-command="Open YouTube">
            <b>YOUTUBE</b>
            <small>Launch media nexus</small>
          </button>

          <button class="quick" data-command="Open Google">
            <b>SEARCH</b>
            <small>Open search engine</small>
          </button>

          <button class="quick" data-command="Tell me a joke">
            <b>JOKE</b>
            <small>Activate humor protocol</small>
          </button>

          <button class="quick" data-command="Set a timer for 10 seconds">
            <b>TIMER</b>
            <small>Temporal automation</small>
          </button>

          <button class="quick" data-command="What is 123 multiplied by 456?">
            <b>CALCULATE</b>
            <small>Compute instantly</small>
          </button>

        </div>
      </section>

      <section class="card history">
        <div class="card-title">
          <span>Command Stream</span>
          <button
            id="clearLog"
            style="
              border:0;
              background:none;
              color:#54718d;
              cursor:pointer;
              font-size:10px;
            "
          >CLEAR</button>
        </div>

        <div class="log" id="log"></div>
      </section>

    </aside>

  </main>

  <footer class="footer">
    <div>
      <b>LOCAL CORE</b> · Browser Automation Matrix
    </div>

    <div class="badges">
      <span class="badge">VOICE</span>
      <span class="badge">TTS</span>
      <span class="badge">WEB</span>
      <span class="badge">AUTOMATION</span>
      <span class="badge">LOCAL STORAGE</span>
    </div>
  </footer>

</div>

<script>
/* =========================================================
   AFFLATUS JARVIS CORE
   ========================================================= */

const $ = selector => document.querySelector(selector);

const input = $("#commandInput");
const response = $("#response");
const orb = $("#orb");
const orbStage = $("#orbStage");
const hero = $("#hero");
const voiceLabel = $("#voiceLabel");
const micBtn = $("#micBtn");
const log = $("#log");
const form = $("#commandForm");
const systemStatus = $("#systemStatus");

let recognition = null;
let listening = false;

/* ---------- PARTICLE UNIVERSE ---------- */

const canvas = $("#universe");
const ctx = canvas.getContext("2d");

let W, H, particles = [];

function resizeCanvas() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  particles = Array.from({
    length: Math.min(180, Math.floor(window.innerWidth / 7))
  }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + .2,
    vx: (Math.random() - .5) * .15,
    vy: (Math.random() - .5) * .15,
    hue: Math.random() > .5 ? 185 : 270
  }));
}

function drawUniverse() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0) p.x = window.innerWidth;
    if (p.x > window.innerWidth) p.x = 0;
    if (p.y < 0) p.y = window.innerHeight;
    if (p.y > window.innerHeight) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle =
      `hsla(${p.hue},100%,70%,${.2 + p.r / 5})`;
    ctx.fill();
  }

  requestAnimationFrame(drawUniverse);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawUniverse();

/* ---------- LOG ---------- */

function timestamp() {
  return new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

function addLog(text, type = "") {
  const item = document.createElement("div");
  item.className = `log-item ${type}`;

  item.innerHTML = `
    <div class="log-meta">${timestamp()}</div>
    <div class="log-text">${escapeHTML(text)}</div>
  `;

  log.appendChild(item);
  log.scrollTop = log.scrollHeight;
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function say(text) {
  response.textContent = text;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = .95;
    utterance.pitch = .85;
    utterance.volume = .9;

    const voices = speechSynthesis.getVoices();
    const preferred =
      voices.find(v => /Google UK English Male/i.test(v.name)) ||
      voices.find(v => /Microsoft David/i.test(v.name)) ||
      voices.find(v => /Daniel/i.test(v.name));

    if (preferred) utterance.voice = preferred;

    speechSynthesis.speak(utterance);
  }
}

/* ---------- COMMAND ENGINE ---------- */

const commands = [

  {
    test: c => /^(hi|hello|hey|wake up|jarvis)$/i.test(c),
    run: async () => {
      say("Systems online. I am listening.");
    }
  },

  {
    test: c => /what time|current time|time is it/i.test(c),
    run: async () => {
      const now = new Date();

      say(
        `The current time is ${now.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        })}.`
      );
    }
  },

  {
    test: c => /what date|today|date is it/i.test(c),
    run: async () => {
      say(
        `Today is ${new Date().toLocaleDateString([], {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        })}.`
      );
    }
  },

  {
    test: c => /open youtube/i.test(c),
    run: async () => {
      say("Opening YouTube.");
      window.open("https://www.youtube.com/", "_blank");
    }
  },

  {
    test: c => /open google/i.test(c),
    run: async () => {
      say("Opening Google.");
      window.open("https://www.google.com/", "_blank");
    }
  },

  {
    test: c => /open github/i.test(c),
    run: async () => {
      say("Opening GitHub.");
      window.open("https://github.com/", "_blank");
    }
  },

  {
    test: c => /search (?:for )?(.+)/i.test(c),
    run: async c => {
      const match = c.match(/search (?:for )?(.+)/i);

      if (!match) return;

      const query = match[1].trim();

      say(`Searching for ${query}.`);

      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );
    }
  },

  {
    test: c => /tell me a joke|make me laugh/i.test(c),
    run: async () => {
      const jokes = [
        "I would tell you a UDP joke, but you might not get it.",
        "Why do programmers prefer dark mode? Because light attracts bugs.",
        "I have optimized my joke engine. Unfortunately, the results are still questionable.",
        "There are only 10 kinds of people: those who understand binary and those who don't."
      ];

      say(jokes[Math.floor(Math.random() * jokes.length)]);
    }
  },

  {
    test: c => /remember (.+)/i.test(c),
    run: async c => {
      const match = c.match(/remember (.+)/i);

      if (!match) return;

      const note = match[1].trim();

      const notes =
        JSON.parse(localStorage.getItem("jarvisNotes") || "[]");

      notes.push({
        text: note,
        created: Date.now()
      });

      localStorage.setItem(
        "jarvisNotes",
        JSON.stringify(notes)
      );

      say("Memory stored locally.");
    }
  },

  {
    test: c => /show my memories|show my notes|what do you remember/i.test(c),
    run: async () => {
      const notes =
        JSON.parse(localStorage.getItem("jarvisNotes") || "[]");

      if (!notes.length) {
        say("My local memory is currently empty.");
        return;
      }

      const latest = notes.slice(-3).map(n => n.text).join(". ");

      say(`Recent memories: ${latest}`);
    }
  },

  {
    test: c => /set (?:a )?timer for (\d+)\s*(second|seconds|minute|minutes)/i.test(c),
    run: async c => {
      const match = c.match(
        /set (?:a )?timer for (\d+)\s*(second|seconds|minute|minutes)/i
      );

      if (!match) return;

      const amount = Number(match[1]);
      const unit = match[2].toLowerCase();

      const milliseconds =
        unit.startsWith("minute")
          ? amount * 60 * 1000
          : amount * 1000;

      say(`Timer armed for ${amount} ${unit}.`);

      setTimeout(() => {
        say(`Timer complete. ${amount} ${unit} have elapsed.`);
        addLog("Timer completed.", "success");
      }, milliseconds);
    }
  },

  {
    test: c => /calculate|what is|compute/i.test(c),
    run: async c => {
      let expression = c
        .replace(/calculate/i, "")
        .replace(/what is/i, "")
        .replace(/compute/i, "")
        .trim()
        .toLowerCase();

      expression = expression
        .replace(/multiplied by/g, "*")
        .replace(/times/g, "*")
        .replace(/divided by/g, "/")
        .replace(/plus/g, "+")
        .replace(/minus/g, "-")
        .replace(/modulo/g, "%")
        .replace(/[^0-9+\-*/%.()\s]/g, "");

      if (!expression) {
        say("I need a mathematical expression.");
        return;
      }

      try {
        /*
          eval is restricted to the sanitized mathematical
          expression above. For production applications,
          replace this with a dedicated math parser.
        */
        const result = Function(
          `"use strict"; return (${expression})`
        )();

        say(`${expression} equals ${result}.`);
      } catch {
        say("I could not safely calculate that expression.");
      }
    }
  },

  {
    test: c => /dark mode|night mode/i.test(c),
    run: async () => {
      document.body.style.setProperty(
        "--cyan",
        "#7df9ff"
      );

      say("Night protocol optimized.");
    }
  },

  {
    test: c => /clear (?:the )?(screen|history|log)/i.test(c),
    run: async () => {
      log.innerHTML = "";
      say("Command stream cleared.");
    }
  },

  {
    test: c => /reload|refresh page/i.test(c),
    run: async () => {
      say("Reloading interface.");
      setTimeout(() => location.reload(), 500);
    }
  },

  {
    test: c => /stop speaking|silence|be quiet/i.test(c),
    run: async () => {
      speechSynthesis.cancel();
      response.textContent = "Audio output terminated.";
    }
  }

];

/* ---------- COMMAND EXECUTION ---------- */

async function executeCommand(rawCommand) {

  const command = rawCommand.trim();

  if (!command) return;

  addLog(`YOU → ${command}`, "user");

  input.value = "";

  systemStatus.textContent = "PROCESSING";
  voiceLabel.textContent = "EXECUTING COMMAND...";

  hero.style.setProperty(
    "--command-energy",
    Math.random()
  );

  let matched = false;

  for (const commandDefinition of commands) {

    if (commandDefinition.test(command)) {

      matched = true;

      try {
        await commandDefinition.run(command);
        addLog("Command executed successfully.", "success");
      } catch (error) {
        console.error(error);
        say("The command encountered an execution error.");
        addLog("Execution error.", "error");
      }

      break;
    }
  }

  if (!matched) {

    /*
      Unknown commands are not secretly executed.
      This is where an authenticated AI backend can be connected.

      Example architecture:

      Browser
        ↓
      /api/agent
        ↓
      LLM / Agent Orchestrator
        ↓
      Approved Tools
        ↓
      Result
        ↓
      Browser

      Never expose private API keys directly in this HTML file.
    */

    say(
      `Command received: "${command}". ` +
      `This command needs an AI/tool integration to execute safely.`
    );

    addLog(
      "No local capability matched. Connect an AI/tool backend for this command.",
      "error"
    );
  }

  systemStatus.textContent = "SYSTEM ONLINE";
  voiceLabel.textContent = listening
    ? "LISTENING..."
    : 'CLICK OR SAY "JARVIS"';
}

/* ---------- FORM ---------- */

form.addEventListener("submit", event => {
  event.preventDefault();
  executeCommand(input.value);
});

/* ---------- QUICK COMMANDS ---------- */

document.querySelectorAll(".quick").forEach(button => {
  button.addEventListener("click", () => {
    executeCommand(button.dataset.command);
  });
});

$("#clearLog").addEventListener("click", () => {
  log.innerHTML = "";
  say("Command stream cleared.");
});

/* ---------- VOICE RECOGNITION ---------- */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = navigator.language || "en-US";

  recognition.onstart = () => {
    listening = true;

    orbStage.classList.add("orb-listening");
    voiceLabel.textContent = "LISTENING...";
    systemStatus.textContent = "VOICE CHANNEL OPEN";

    addLog("Voice channel activated.");
  };

  recognition.onresult = event => {

    let transcript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      transcript += event.results[i][0].transcript;
    }

    transcript = transcript.trim();

    input.value = transcript;

    const finalResult =
      event.results[event.results.length - 1].isFinal;

    if (finalResult) {

      /*
        Optional wake-word behavior:
        "Jarvis open YouTube"
        "Jarvis what time is it"
      */

      const cleaned = transcript.replace(
        /^jarvis[\s,:-]*/i,
        ""
      );

      executeCommand(cleaned || "hello");
    }
  };

  recognition.onerror = event => {

    console.warn("Speech recognition:", event.error);

    if (event.error === "not-allowed") {
      say("Microphone permission was denied.");
    } else {
      say("Voice recognition encountered a temporary problem.");
    }
  };

  recognition.onend = () => {

    listening = false;

    orbStage.classList.remove("orb-listening");

    systemStatus.textContent = "SYSTEM ONLINE";
    voiceLabel.textContent = 'CLICK OR SAY "JARVIS"';
  };

} else {

  micBtn.disabled = true;
  micBtn.style.opacity = ".4";

  voiceLabel.textContent =
    "VOICE API NOT SUPPORTED — USE CHROME/EDGE";
}

/* ---------- MIC ---------- */

function startListening() {

  if (!recognition) {
    say("Voice recognition is not supported in this browser.");
    return;
  }

  if (listening) {
    recognition.stop();
    return;
  }

  try {
    recognition.start();
  } catch (error) {
    console.warn(error);
  }
}

micBtn.addEventListener("click", startListening);
orb.addEventListener("click", startListening);

/* ---------- KEYBOARD SHORTCUT ---------- */

document.addEventListener("keydown", event => {

  if (
    event.key === "/" &&
    document.activeElement !== input
  ) {
    event.preventDefault();
    input.focus();
  }

  if (
    event.code === "Space" &&
    document.activeElement !== input
  ) {
    event.preventDefault();
    startListening();
  }
});

/* ---------- WELCOME ---------- */

setTimeout(() => {

  addLog(
    "AFFLATUS CORE initialized. Awaiting directive.",
    "success"
  );

  say("Afflatus core online.");

}, 700);

/* ---------- EXPOSE EXTENSION API ---------- */

/*
  Other JavaScript modules can register new capabilities:

  window.JARVIS.register({
    test: command => /send email/i.test(command),
    run: async command => {
      // Your authenticated backend integration
    }
  });

  This makes the interface an extensible command shell.
*/

window.JARVIS = {

  execute: executeCommand,

  register(definition) {

    if (
      typeof definition?.test !== "function" ||
      typeof definition?.run !== "function"
    ) {
      throw new Error(
        "A JARVIS capability requires test() and run()."
      );
    }

    commands.unshift(definition);

    addLog(
      "New capability registered.",
      "success"
    );
  },

  speak: say,

  memory: {

    save(value) {

      const notes =
        JSON.parse(
          localStorage.getItem("jarvisNotes") || "[]"
        );

      notes.push({
        text: String(value),
        created: Date.now()
      });

      localStorage.setItem(
        "jarvisNotes",
        JSON.stringify(notes)
      );
    },

    get() {

      return JSON.parse(
        localStorage.getItem("jarvisNotes") || "[]"
      );
    }
  }
};

</script>

</body>
