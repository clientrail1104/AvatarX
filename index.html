<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .avatar-card {
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 360px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .video-container {
            width: 100%;
            height: 360px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background-color: #0f3460;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #888;
        }

        .indicator.active {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Waveform Animation */
        .waveform {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 30px;
            margin: 20px 0;
        }

        .bar {
            width: 4px;
            height: 8px;
            background-color: #e94560;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .speaking .bar {
            animation: pulse 0.6s infinite alternate ease-in-out;
        }

        .speaking .bar:nth-child(1) { animation-delay: 0.1s; }
        .speaking .bar:nth-child(2) { animation-delay: 0.2s; }
        .speaking .bar:nth-child(3) { animation-delay: 0.4s; }
        .speaking .bar:nth-child(4) { animation-delay: 0.15s; }
        .speaking .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes pulse {
            0% { height: 6px; }
            100% { height: 28px; }
        }

        .controls {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #e94560;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="avatar-card">
        <div class="video-container">
            <div class="status-badge">
                <span class="indicator" id="status-dot"></span>
                <span id="status-text">IDLE</span>
            </div>
            <video id="avatar-video" loop muted playsinline>
                <source src="agent-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="waveform" id="waveform">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="controls">
            <button id="toggle-btn" onclick="toggleSpeech()">Start Speaking</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('avatar-video');
        const waveform = document.getElementById('waveform');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');

        let isSpeaking = false;

        function toggleSpeech() {
            isSpeaking = !isSpeaking;

            if (isSpeaking) {
                video.play();
                waveform.classList.add('speaking');
                statusDot.classList.add('active');
                statusText.innerText = 'SPEAKING';
                toggleBtn.innerText = 'Stop Speaking';
            } else {
                video.pause();
                waveform.classList.remove('speaking');
                statusDot.classList.remove('active');
                statusText.innerText = 'IDLE';
                toggleBtn.innerText = 'Start Speaking';
            }
        }
    </script>
</body>
</html>
