<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA-X | Autonomous AI Presenter & Command Hub</title>
  <style>
    :root {
      --bg-dark: #05070f;
      --panel-bg: rgba(13, 17, 28, 0.75);
      --accent-cyan: #00f3ff;
      --accent-magenta: #ff0055;
      --accent-purple: #8a2be2;
      --text-main: #f0f4f8;
      --text-muted: #64748b;
      --border-glow: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
    }

    /* Header */
    header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--border-glow);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 2s infinite;
    }

    /* Main Grid Layout */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      padding: 1.5rem;
      height: calc(100vh - 70px);
    }

    /* Presenter Viewport */
    .viewport-container {
      position: relative;
      background: var(--panel-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    #avatarCanvas {
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 800px;
      object-fit: contain;
    }

    .overlay-controls {
      position: absolute;
      bottom: 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      background: rgba(5, 7, 15, 0.8);
      padding: 0.75rem 1.5rem;
      border-radius: 40px;
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(10px);
    }

    .btn-mic {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: all 0.3s ease;
    }

    .btn-mic:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    }

    .btn-mic.listening {
      background: linear-gradient(135deg, var(--accent-magenta), #ff5500);
      animation: mic-pulse 1.2s infinite;
    }

    /* Control Panel Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel {
      background: var(--panel-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Command Log */
    .log-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 250px;
      padding-right: 0.5rem;
    }

    .log-entry {
      font-size: 0.85rem;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-cyan);
    }

    .log-entry.system { border-left-color: var(--accent-purple); }
    .log-entry.user { border-left-color: var(--accent-cyan); }
    .log-entry.action { border-left-color: var(--accent-magenta); }

    /* Controls Form */
    select, input, button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    select option {
      background: var(--bg-dark);
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .input-group input {
      flex: 1;
    }

    .btn-action {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(255, 0, 85, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
        <path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6zm0 10a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/>
      </svg>
      AURA-X AI PRESENTER
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="statusText">System Ready</span>
    </div>
  </header>

  <main>
    <!-- Presenter Render Viewport -->
    <div class="viewport-container">
      <canvas id="avatarCanvas" width="800" height="800"></canvas>
      
      <div class="overlay-controls">
        <button class="btn-mic" id="micBtn" title="Toggle Voice Commands">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div style="font-size: 0.85rem; color: var(--text-muted);">
          Click to speak or type a command below
        </div>
      </div>
    </div>

    <!-- Control & Command Hub -->
    <div class="sidebar">
      
      <!-- Presenter Config -->
      <div class="panel">
        <div class="panel-title">Presenter Engine Settings</div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Voice Synthesizer</label>
        <select id="voiceSelect"></select>
        
        <div style="display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: var(--text-muted);">Pitch</label>
            <input type="range" id="pitchVal" min="0.5" max="1.5" step="0.1" value="1.1" style="width: 100%;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: var(--text-muted);">Rate</label>
            <input type="range" id="rateVal" min="0.5" max="1.5" step="0.1" value="1.0" style="width: 100%;">
          </div>
        </div>
      </div>

      <!-- Command Console -->
      <div class="panel" style="flex: 1;">
        <div class="panel-title">Autonomous Execution Log</div>
        <div class="log-container" id="logContainer">
          <div class="log-entry system">System initialized. Voice engine connected.</div>
        </div>
        
        <div class="input-group">
          <input type="text" id="textCommand" placeholder="Type command (e.g., 'open google', 'change theme')..." />
          <button class="btn-action" id="sendBtn">Execute</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    /**
     * PROCEDURAL AI PRESENTER ENGINE (Canvas-based Rigging)
     * Renders lip-syncing, eye movement, head tilts, posture shifts, and breathing.
     */
    class AIPresenter {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        
        // Motion States
        this.time = 0;
        this.blinkState = 0; // 0 (open) to 1 (closed)
        this.blinkTimer = 0;
        this.eyeTargetX = 0;
        this.eyeTargetY = 0;
        this.eyeX = 0;
        this.eyeY = 0;
        this.headTiltTarget = 0;
        this.headTilt = 0;
        
        // Lip Sync & Audio States
        this.mouthOpenness = 0;
        this.isSpeaking = false;
        
        // Gesture States
        this.handYTarget = 0;
        this.handY = 0;

        this.init();
      }

      init() {
        this.scheduleEvents();
        this.render();
      }

      scheduleEvents() {
        // Random blinking
        setInterval(() => {
          if (Math.random() > 0.3) this.triggerBlink();
        }, 3500);

        // Micro eye gaze shifts
        setInterval(() => {
          this.eyeTargetX = (Math.random() - 0.5) * 12;
          this.eyeTargetY = (Math.random() - 0.5) * 6;
        }, 2500);

        // Subtle head turns
        setInterval(() => {
          this.headTiltTarget = (Math.random() - 0.5) * 0.08;
        }, 4000);
      }

      triggerBlink() {
        let duration = 150;
        let start = Date.now();
        let animate = () => {
          let elapsed = Date.now() - start;
          if (elapsed < duration / 2) {
            this.blinkState = elapsed / (duration / 2);
            requestAnimationFrame(animate);
          } else if (elapsed < duration) {
            this.blinkState = 1 - (elapsed - duration / 2) / (duration / 2);
            requestAnimationFrame(animate);
          } else {
            this.blinkState = 0;
          }
        };
        animate();
      }

      setSpeechMouthLevel(level) {
        this.mouthOpenness = level;
      }

      render() {
        this.time += 0.03;
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;

        // Smooth Interpolations
        this.eyeX += (this.eyeTargetX - this.eyeX) * 0.08;
        this.eyeY += (this.eyeTargetY - this.eyeY) * 0.08;
        this.headTilt += (this.headTiltTarget - this.headTilt) * 0.05;

        // Procedural Motion Calculations
        const breathingOffset = Math.sin(this.time * 1.5) * 4;
        const postureShift = Math.cos(this.time * 0.8) * 2;

        ctx.clearRect(0, 0, w, h);

        ctx.save();
        // Center pivot for head tilt
        ctx.translate(w / 2, h / 2 + postureShift);
        ctx.rotate(this.headTilt);

        // --- TORSO / CLOTHING ---
        ctx.fillStyle = '#1e1b4b'; // Sleek dark blazer
        ctx.beginPath();
        ctx.moveTo(-180, 280 + breathingOffset);
        ctx.quadraticCurveTo(0, 180 + breathingOffset, 180, 280 + breathingOffset);
        ctx.lineTo(250, 400);
        ctx.lineTo(-250, 400);
        ctx.closePath();
        ctx.fill();

        // Inner shirt
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.moveTo(-40, 210 + breathingOffset);
        ctx.lineTo(0, 260 + breathingOffset);
        ctx.lineTo(40, 210 + breathingOffset);
        ctx.closePath();
        ctx.fill();

        // --- NECK ---
        ctx.fillStyle = '#f3d0b7';
        ctx.fillRect(-35, 110, 70, 90);

        // --- FACE BASE ---
        ctx.fillStyle = '#fcd5ce';
        ctx.beginPath();
        ctx.ellipse(0, 30, 110, 145, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- HAIR (Back) ---
        ctx.fillStyle = '#2a1a1f';
        ctx.beginPath();
        ctx.ellipse(0, 10, 135, 160, 0, 0, Math.PI * 2);
        ctx.fill();
        // Re-draw face over back hair
        ctx.fillStyle = '#fcd5ce';
        ctx.beginPath();
        ctx.ellipse(0, 30, 110, 140, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- EYES ---
        const drawEye = (cx) => {
          ctx.save();
          ctx.translate(cx, -10);

          // Eye White
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(0, 0, 22, 12 * (1 - this.blinkState), 0, 0, Math.PI * 2);
          ctx.fill();

          if (this.blinkState < 0.8) {
            // Iris
            ctx.fillStyle = '#4338ca';
            ctx.beginPath();
            ctx.arc(this.eyeX * 0.5, this.eyeY * 0.5, 9, 0, Math.PI * 2);
            ctx.fill();

            // Pupil
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(this.eyeX * 0.5, this.eyeY * 0.5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Reflection Highlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.eyeX * 0.5 - 3, this.eyeY * 0.5 - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Eyelashes / Lid Line
          ctx.strokeStyle = '#1e1b18';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, 0, 23, 12 * (1 - this.blinkState), 0, Math.PI, Math.PI * 2);
          ctx.stroke();

          ctx.restore();
        };

        drawEye(-45);
        drawEye(45);

        // --- EYEBROWS ---
        ctx.strokeStyle = '#3a2522';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.quadraticCurveTo(-45, -35 + (this.mouthOpenness * 2), -25, -30);
        ctx.stroke();
        ctx.beginPath();
        ctx.quadraticCurveTo(45, -35 + (this.mouthOpenness * 2), 25, -30);
        ctx.stroke();

        // --- NOSE ---
        ctx.strokeStyle = '#e29578';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.lineTo(-3, 35);
        ctx.lineTo(4, 37);
        ctx.stroke();

        // --- MOUTH & LIP SYNC ---
        ctx.save();
        ctx.translate(0, 85);
        
        let mOpen = Math.max(2, this.mouthOpenness * 28);

        // Lips Outer
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 6 + mOpen * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cavity
        if (mOpen > 4) {
          ctx.fillStyle = '#3a090d';
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, mOpen * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();

          // Teeth
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-12, -mOpen * 0.4, 24, 4);
        }

        ctx.restore();

        // --- HAIR (Front Frame) ---
        ctx.fillStyle = '#2a1a1f';
        ctx.beginPath();
        ctx.moveTo(-110, -30);
        ctx.quadraticCurveTo(-60, -120, 0, -80);
        ctx.quadraticCurveTo(60, -120, 110, -30);
        ctx.quadraticCurveTo(120, 80, 130, 150);
        ctx.quadraticCurveTo(80, 0, 80, -40);
        ctx.quadraticCurveTo(-80, 0, -80, -40);
        ctx.quadraticCurveTo(-120, 80, -110, -30);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(() => this.render());
      }
    }

    /**
     * VOICEBOT & COMMAND AUTOMATION ENGINE
     */
    class CommandHub {
      constructor(presenter) {
        this.presenter = presenter;
        this.synth = window.speechSynthesis;
        this.recognition = null;
        this.selectedVoice = null;
        
        this.initSpeech();
        this.setupEventListeners();
      }

      initSpeech() {
        // Voice Synth Setup
        const populateVoices = () => {
          const voices = this.synth.getVoices();
          const voiceSelect = document.getElementById('voiceSelect');
          voiceSelect.innerHTML = '';
          
          // Filter for realistic female voices first
          voices.forEach((voice, i) => {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `${voice.name} (${voice.lang})`;
            if (voice.name.includes('Zira') || voice.name.includes('Samantha') || voice.name.includes('Female') || voice.name.includes('Google UK English Female')) {
              option.selected = true;
              this.selectedVoice = voice;
            }
            voiceSelect.appendChild(option);
          });

          if (!this.selectedVoice && voices.length > 0) {
            this.selectedVoice = voices[0];
          }
        };

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
          speechSynthesis.onvoiceschanged = populateVoices;
        }

        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          this.recognition = new SpeechRecognition();
          this.recognition.continuous = false;
          this.recognition.interimResults = false;

          this.recognition.onstart = () => {
            document.getElementById('micBtn').classList.add('listening');
            this.updateStatus("Listening...");
          };

          this.recognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript;
            this.log(`User: "${cmd}"`, 'user');
            this.processCommand(cmd);
          };

          this.recognition.onend = () => {
            document.getElementById('micBtn').classList.remove('listening');
            this.updateStatus("System Ready");
          };
        } else {
          this.log("Speech Recognition API not supported in this browser.", 'system');
        }
      }

      speak(text) {
        if (this.synth.speaking) this.synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const voices = this.synth.getVoices();
        const voiceIdx = document.getElementById('voiceSelect').value;
        
        if (voices[voiceIdx]) utterance.voice = voices[voiceIdx];
        utterance.pitch = parseFloat(document.getElementById('pitchVal').value);
        utterance.rate = parseFloat(document.getElementById('rateVal').value);

        // Procedural Lip Sync Syncing
        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            // Trigger randomized speech mouth opening
            this.presenter.setSpeechMouthLevel(Math.random() * 0.7 + 0.3);
            setTimeout(() => this.presenter.setSpeechMouthLevel(0.1), 150);
          }
        };

        utterance.onstart = () => {
          this.presenter.isSpeaking = true;
          this.updateStatus("Speaking...");
        };

        utterance.onend = () => {
          this.presenter.isSpeaking = false;
          this.presenter.setSpeechMouthLevel(0);
          this.updateStatus("System Ready");
        };

        this.synth.speak(utterance);
      }

      processCommand(commandStr) {
        const cmd = commandStr.toLowerCase();
        this.log(`Automating: Executing simultaneous instruction pipeline...`, 'action');

        // Dynamic Automated Actions Engine
        if (cmd.includes('hello') || cmd.includes('hi')) {
          this.speak("Hello! I am your AI presenter. I am ready to process your unlimited commands instantly.");
        } 
        else if (cmd.includes('time')) {
          const now = new Date().toLocaleTimeString();
          this.speak(`The current system time is ${now}`);
        }
        else if (cmd.includes('open google')) {
          this.speak("Opening Google search engine.");
          window.open('https://www.google.com', '_blank');
        }
        else if (cmd.includes('open youtube')) {
          this.speak("Opening YouTube.");
          window.open('https://www.youtube.com', '_blank');
        }
        else if (cmd.includes('background') || cmd.includes('theme')) {
          document.body.style.backgroundImage = 'radial-gradient(circle at 50% 50%, #1e1b4b 0%, #000000 100%)';
          this.speak("Visual atmosphere updated smoothly.");
        }
        else {
          // Autonomous fallback command simulation
          this.speak(`Command received: "${commandStr}". Executing autonomous AI workflows across system pipelines.`);
        }
      }

      log(msg, type = 'system') {
        const container = document.getElementById('logContainer');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = msg;
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
      }

      updateStatus(str) {
        document.getElementById('statusText').textContent = str;
      }

      setupEventListeners() {
        document.getElementById('micBtn').addEventListener('click', () => {
          if (this.recognition) {
            this.recognition.start();
          }
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
          const input = document.getElementById('textCommand');
          if (input.value.trim()) {
            this.log(`User: "${input.value}"`, 'user');
            this.processCommand(input.value);
            input.value = '';
          }
        });

        document.getElementById('textCommand').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            document.getElementById('sendBtn').click();
          }
        });
      }
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      const presenter = new AIPresenter('avatarCanvas');
      const hub = new CommandHub(presenter);
    });
  </script>
</body>
</html>
