<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AvatarX — AI Assistant</title>

<style>
:root {
    --blue: #1683ff;
    --blue2: #006eff;
    --cyan: #00d9ff;
    --dark: #07101d;
    --panel: rgba(7, 18, 35, .88);
    --glass: rgba(15, 30, 53, .76);
    --border: rgba(65, 157, 255, .38);
    --text: #ffffff;
    --muted: #9caec4;
    --danger: #ff4056;
    --green: #20ed73;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:
        radial-gradient(circle at 50% 35%, rgba(0, 103, 255, .16), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(0, 217, 255, .08), transparent 28%),
        #02070e;
    color: white;
}

/* =========================================================
   APP
========================================================= */

.avatar-app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center 80%,
            rgba(0, 100, 255, .16),
            transparent 48%
        );
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .06;
    background-image:
        linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: linear-gradient(to bottom, transparent, black 30%, transparent);
}

/* =========================================================
   TOP STATUS
========================================================= */

.status-pill {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 50;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 12px 18px;

    border: 1px solid rgba(39, 152, 255, .45);
    border-radius: 30px;

    background: rgba(8, 21, 39, .82);

    box-shadow:
        0 0 25px rgba(0, 104, 255, .20),
        inset 0 0 20px rgba(0, 110, 255, .06);

    backdrop-filter: blur(18px);

    font-size: 14px;
    font-weight: 600;
}

.status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--green);

    box-shadow:
        0 0 8px var(--green),
        0 0 18px rgba(32,237,115,.7);

    animation: pulseGreen 1.8s infinite;
}

.status-pill.connecting .status-dot {
    background: #ffc400;
    box-shadow: 0 0 14px #ffc400;
}

.status-pill.offline .status-dot {
    background: var(--danger);
    box-shadow: 0 0 14px rgba(255,64,86,.7);
}

@keyframes pulseGreen {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .5;
        transform: scale(.75);
    }
}

/* =========================================================
   CLOSE
========================================================= */

.close-button {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 60;

    width: 56px;
    height: 56px;

    border-radius: 50%;
    border: 1px solid rgba(60,155,255,.5);

    background:
        radial-gradient(circle at center,
        rgba(18,57,103,.95),
        rgba(4,14,27,.94));

    color: white;

    font-size: 32px;
    font-weight: 200;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(0,110,255,.45),
        inset 0 0 20px rgba(0,115,255,.15);

    transition: .25s ease;
}

.close-button:hover {
    transform: rotate(90deg) scale(1.05);
}

/* =========================================================
   AVATAR STAGE
========================================================= */

.avatar-stage {
    position: absolute;
    left: 50%;
    bottom: 0;

    width: min(820px, 80vw);
    height: 86vh;

    transform: translateX(-50%);

    display: flex;
    justify-content: center;
    align-items: flex-end;

    pointer-events: none;

    transition: .6s ease;
}

.avatar-stage.active {
    animation: avatarEntrance .9s cubic-bezier(.16,1,.3,1);
}

@keyframes avatarEntrance {
    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(80px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   LIVE AVATAR
========================================================= */

.avatar-live-wrap {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    animation: gentleFloat 5s ease-in-out infinite;
}

@keyframes gentleFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/*
   IMPORTANT:
   Anam streams into this video element.
*/

#avatar-video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    border: 0;
    outline: 0;

    background: transparent;

    filter:
        drop-shadow(0 25px 60px rgba(0,0,0,.55))
        drop-shadow(0 0 30px rgba(0,105,255,.12));

    transition:
        opacity .6s ease,
        transform .6s ease;
}

#avatar-video.hidden {
    opacity: 0;
    transform: scale(.94);
}

/* =========================================================
   AVATAR GLOW
========================================================= */

.avatar-glow {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 55%;
    height: 180px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(0,113,255,.28),
            transparent 68%
        );

    filter: blur(25px);

    z-index: -1;
}

/* =========================================================
   WELCOME MESSAGE
========================================================= */

.welcome-card {
    position: absolute;

    top: 105px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    width: min(390px, calc(100vw - 40px));

    padding: 18px 22px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(18,48,88,.93),
            rgba(3,15,30,.92)
        );

    border: 1px solid rgba(43,143,255,.48);

    box-shadow:
        0 15px 45px rgba(0,0,0,.4),
        0 0 28px rgba(0,104,255,.28),
        inset 0 0 30px rgba(0,120,255,.07);

    backdrop-filter: blur(20px);

    animation: bubbleIn .8s cubic-bezier(.16,1,.3,1);
}

.welcome-card::after {
    content: "";

    position: absolute;

    bottom: -12px;
    left: 50%;

    width: 22px;
    height: 22px;

    background: #0a203c;

    transform: translateX(-50%) rotate(45deg);

    border-right: 1px solid rgba(43,143,255,.48);
    border-bottom: 1px solid rgba(43,143,255,.48);
}

@keyframes bubbleIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(-15px) scale(.94);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
    }
}

.welcome-title {
    font-size: 19px;
    font-weight: 750;
    margin-bottom: 5px;
}

.welcome-text {
    color: #d7e5f6;
    font-size: 14px;
    line-height: 1.5;
}

/* =========================================================
   MINI ASSISTANT
========================================================= */

.mini-assistant {
    position: absolute;

    right: 25px;
    top: 105px;

    z-index: 40;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px 16px 12px 12px;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            rgba(12,45,84,.96),
            rgba(5,17,31,.96)
        );

    border: 1px solid rgba(46,145,255,.48);

    box-shadow:
        0 0 30px rgba(0,105,255,.25);

    backdrop-filter: blur(18px);

    animation: miniFloat 4s ease-in-out infinite;
}

@keyframes miniFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

.mini-avatar {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    background: #152c47;

    border: 2px solid rgba(73,170,255,.65);

    box-shadow: 0 0 20px rgba(0,116,255,.35);
}

.mini-title {
    font-size: 14px;
    font-weight: 700;
}

.mini-subtitle {
    margin-top: 2px;

    color: #9eb3cb;

    font-size: 12px;
}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-actions {
    position: absolute;

    right: 28px;
    top: 190px;

    z-index: 45;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.quick-action {
    display: flex;
    align-items: center;
    gap: 11px;

    min-width: 150px;

    padding: 10px 14px;

    border: 1px solid rgba(68,154,255,.32);

    border-radius: 30px;

    background: rgba(9,24,44,.78);

    color: #e9f3ff;

    cursor: pointer;

    backdrop-filter: blur(15px);

    box-shadow: 0 0 18px rgba(0,93,255,.10);

    transition: .25s ease;

    font-size: 13px;
    font-weight: 600;
}

.quick-action:hover {
    transform: translateX(-6px);

    border-color: rgba(78,174,255,.72);

    background: rgba(13,38,69,.9);

    box-shadow:
        0 0 24px rgba(0,105,255,.28);
}

.quick-icon {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(23,62,105,.85);

    font-size: 14px;
}

/* =========================================================
   WAVEFORM
========================================================= */

.wave-card {
    position: absolute;

    left: 30px;
    top: 180px;

    z-index: 40;

    padding: 13px 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(12,38,70,.92),
            rgba(4,16,29,.92)
        );

    border: 1px solid rgba(47,146,255,.45);

    box-shadow:
        0 0 25px rgba(0,100,255,.2);

    backdrop-filter: blur(18px);
}

.wave-top {
    display: flex;
    align-items: center;
    gap: 9px;

    color: #eaf4ff;

    font-size: 13px;
    font-weight: 650;

    margin-bottom: 10px;
}

.mic-small {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #096fff;

    box-shadow: 0 0 15px rgba(0,119,255,.6);
}

.waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;

    height: 25px;
}

.waveform span {
    width: 3px;

    border-radius: 4px;

    background: linear-gradient(
        to top,
        #0780ff,
        #00dcff
    );

    animation: wave 1s ease-in-out infinite;
}

.waveform span:nth-child(1) { height: 7px; animation-delay: .0s; }
.waveform span:nth-child(2) { height: 15px; animation-delay: .1s; }
.waveform span:nth-child(3) { height: 22px; animation-delay: .2s; }
.waveform span:nth-child(4) { height: 12px; animation-delay: .3s; }
.waveform span:nth-child(5) { height: 20px; animation-delay: .4s; }
.waveform span:nth-child(6) { height: 10px; animation-delay: .5s; }
.waveform span:nth-child(7) { height: 17px; animation-delay: .6s; }
.waveform span:nth-child(8) { height: 8px; animation-delay: .7s; }
.waveform span:nth-child(9) { height: 19px; animation-delay: .8s; }
.waveform span:nth-child(10) { height: 12px; animation-delay: .9s; }

@keyframes wave {
    0%,100% {
        transform: scaleY(.55);
        opacity: .55;
    }

    50% {
        transform: scaleY(1.15);
        opacity: 1;
    }
}

/* =========================================================
   BOTTOM CONTROLS
========================================================= */

.control-dock {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 100;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 10px 13px;

    border-radius: 38px;

    background:
        linear-gradient(
            135deg,
            rgba(12,29,50,.96),
            rgba(3,11,20,.96)
        );

    border: 1px solid rgba(61,147,255,.42);

    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        0 0 30px rgba(0,100,255,.18);

    backdrop-filter: blur(22px);
}

.control-button {
    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background: rgba(24,42,65,.92);

    cursor: pointer;

    font-size: 20px;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.control-button:hover {
    transform: translateY(-3px);

    background: rgba(33,61,92,.95);

    box-shadow:
        0 0 20px rgba(0,112,255,.25);
}

.control-button.primary {
    width: 62px;
    height: 62px;

    background:
        radial-gradient(
            circle,
            #168cff,
            #0056d6
        );

    border: 1px solid rgba(130,210,255,.55);

    box-shadow:
        0 0 20px rgba(0,125,255,.75),
        0 0 45px rgba(0,110,255,.35);
}

.control-button.primary.active {
    animation: micPulse 1.4s infinite;
}

@keyframes micPulse {
    0%,100% {
        box-shadow:
            0 0 20px rgba(0,125,255,.75),
            0 0 45px rgba(0,110,255,.35);
    }

    50% {
        box-shadow:
            0 0 28px rgba(0,160,255,.95),
            0 0 70px rgba(0,110,255,.55);
    }
}

.control-button.end {
    background:
        linear-gradient(
            135deg,
            #ff475d,
            #d71936
        );

    box-shadow:
        0 0 18px rgba(255,54,78,.3);
}

/* =========================================================
   START OVERLAY
========================================================= */

.start-overlay {
    position: absolute;
    inset: 0;

    z-index: 200;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,94,255,.14),
            rgba(0,0,0,.82)
        );

    backdrop-filter: blur(8px);

    transition: opacity .4s ease;
}

.start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.start-card {
    width: min(460px, calc(100vw - 40px));

    text-align: center;

    padding: 34px 28px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(12,33,59,.96),
            rgba(3,12,22,.97)
        );

    border: 1px solid rgba(56,153,255,.45);

    box-shadow:
        0 25px 80px rgba(0,0,0,.6),
        0 0 50px rgba(0,100,255,.18);

    backdrop-filter: blur(24px);

    animation: cardIn .7s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.94);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.start-avatar {
    width: 82px;
    height: 82px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background:
        radial-gradient(circle at 40% 30%, #4eb7ff, #073b85);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;

    border: 2px solid rgba(85,182,255,.65);

    box-shadow:
        0 0 25px rgba(0,121,255,.55),
        0 0 70px rgba(0,98,255,.2);
}

.start-card h1 {
    margin: 0 0 10px;

    font-size: 28px;
    letter-spacing: -.5px;
}

.start-card p {
    margin: 0 auto 25px;

    max-width: 350px;

    color: #a9bbd1;

    font-size: 14px;
    line-height: 1.6;
}

.start-button {
    width: 100%;

    border: 0;

    padding: 15px 20px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #168dff,
            #005bd8
        );

    color: white;

    font-size: 15px;
    font-weight: 750;

    cursor: pointer;

    box-shadow:
        0 0 25px rgba(0,113,255,.35);

    transition: .25s ease;
}

.start-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 0 35px rgba(0,128,255,.55);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 105px;

    z-index: 500;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    padding: 12px 18px;

    border-radius: 14px;

    background: rgba(7,21,37,.94);

    border: 1px solid rgba(60,158,255,.45);

    box-shadow:
        0 10px 30px rgba(0,0,0,.45),
        0 0 20px rgba(0,103,255,.18);

    color: #e9f4ff;

    font-size: 13px;

    transition: .3s ease;
}

.toast.show {
    opacity: 1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .avatar-stage {
        width: 100vw;
        height: 76vh;
    }

    .wave-card {
        left: 15px;
        top: 150px;
        transform: scale(.9);
        transform-origin: left top;
    }

    .quick-actions {
        right: 15px;
        top: 170px;
        transform: scale(.9);
        transform-origin: right top;
    }

    .mini-assistant {
        right: 15px;
        top: 85px;
    }
}

@media (max-width: 650px) {

    .status-pill {
        top: 14px;
        left: 14px;
        padding: 9px 13px;
        font-size: 12px;
    }

    .close-button {
        top: 10px;
        right: 12px;
        width: 45px;
        height: 45px;
        font-size: 25px;
    }

    .welcome-card {
        top: 85px;
        width: calc(100vw - 80px);
        padding: 14px 16px;
    }

    .welcome-title {
        font-size: 16px;
    }

    .welcome-text {
        font-size: 12px;
    }

    .wave-card {
        display: none;
    }

    .mini-assistant {
        display: none;
    }

    .quick-actions {
        display: none;
    }

    .avatar-stage {
        height: 78vh;
        width: 110vw;
    }

    .control-dock {
        bottom: 12px;
        padding: 8px 10px;
        gap: 8px;
    }

    .control-button {
        width: 46px;
        height: 46px;
        font-size: 18px;
    }

    .control-button.primary {
        width: 58px;
        height: 58px;
    }

    .start-card {
        padding: 28px 22px;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="avatar-app">

    <div class="background-glow"></div>
    <div class="grid"></div>

    <!-- STATUS -->
    <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">AI Assistant Online</span>
    </div>

    <!-- CLOSE -->
    <button
        class="close-button"
        id="closeButton"
        aria-label="Close assistant"
    >
        ×
    </button>

    <!-- WELCOME -->
    <div class="welcome-card" id="welcomeCard">

        <div class="welcome-title">
            Hi there! 👋
        </div>

        <div class="welcome-text">
            I'm your AI Assistant.
            <br>
            How can I help you today?
        </div>

    </div>

    <!-- LEFT WAVE -->
    <div class="wave-card">

        <div class="wave-top">
            <div class="mic-small">🎙</div>
            <span id="waveText">Ready to talk</span>
        </div>

        <div class="waveform">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- MINI ASSISTANT -->
    <div class="mini-assistant">

        <div class="mini-avatar">
            AI
        </div>

        <div>
            <div class="mini-title">
                Need help?
            </div>

            <div class="mini-subtitle">
                Ask me anything!
            </div>
        </div>

    </div>

    <!-- QUICK ACTIONS -->
    <div class="quick-actions">

        <button class="quick-action" data-message="Tell me about your services.">
            <span class="quick-icon">▤</span>
            <span>Services</span>
        </button>

        <button class="quick-action" data-message="Tell me about pricing.">
            <span class="quick-icon">$</span>
            <span>Pricing</span>
        </button>

        <button class="quick-action" data-message="I need support.">
            <span class="quick-icon">◉</span>
            <span>Support</span>
        </button>

        <button class="quick-action" data-message="I would like to book a demo.">
            <span class="quick-icon">▣</span>
            <span>Book a Demo</span>
        </button>

    </div>

    <!-- LIVE AVATAR -->
    <div class="avatar-stage" id="avatarStage">

        <div class="avatar-live-wrap">

            <video
                id="avatar-video"
                autoplay
                playsinline
                muted
            ></video>

            <div class="avatar-glow"></div>

        </div>

    </div>

    <!-- CONTROLS -->
    <div class="control-dock">

        <button
            class="control-button"
            id="chatButton"
            title="Chat"
        >
            ▣
        </button>

        <button
            class="control-button primary"
            id="startButton"
            title="Start conversation"
        >
            🎙
        </button>

        <button
            class="control-button"
            id="speakerButton"
            title="Speaker"
        >
            🔊
        </button>

        <button
            class="control-button end"
            id="endButton"
            title="End conversation"
            disabled
        >
            ☎
        </button>

    </div>

    <!-- START OVERLAY -->
    <div class="start-overlay" id="startOverlay">

        <div class="start-card">

            <div class="start-avatar">
                ✨
            </div>

            <h1>
                Meet your AI Assistant
            </h1>

            <p>
                Start a real-time conversation with your
                AI assistant. Speak naturally and the avatar
                will respond with synchronized voice and animation.
            </p>

            <button
                class="start-button"
                id="startConversation"
            >
                🎙 Start Conversation
            </button>

        </div>

    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

</div>


<script type="module">

/*
=========================================================
 AVATARX CONFIGURATION
=========================================================

 IMPORTANT:

 The Anam API key and ElevenLabs API key are NOT here.

 Your browser calls Supabase and receives a short-lived
 Anam session token.

=========================================================
*/

const SUPABASE_FUNCTION_URL =
    "https://cfthqsvxidzxflbvhxkk.supabase.co/functions/v1/anam-eleven-session";


/*
=========================================================
 ANAM SDK
=========================================================
*/

import {
    createClient,
    AnamEvent
} from "https://esm.sh/@anam-ai/js-sdk";


/*
=========================================================
 ELEMENTS
=========================================================
*/

const avatarVideo =
    document.getElementById("avatar-video");

const avatarStage =
    document.getElementById("avatarStage");

const startOverlay =
    document.getElementById("startOverlay");

const startButton =
    document.getElementById("startButton");

const startConversation =
    document.getElementById("startConversation");

const endButton =
    document.getElementById("endButton");

const closeButton =
    document.getElementById("closeButton");

const speakerButton =
    document.getElementById("speakerButton");

const chatButton =
    document.getElementById("chatButton");

const statusPill =
    document.getElementById("statusPill");

const statusText =
    document.getElementById("statusText");

const waveText =
    document.getElementById("waveText");

const welcomeCard =
    document.getElementById("welcomeCard");

const toast =
    document.getElementById("toast");


/*
=========================================================
 STATE
=========================================================
*/

let anamClient = null;
let isConnected = false;
let isMuted = false;


/*
=========================================================
 TOAST
=========================================================
*/

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}


/*
=========================================================
 STATUS
=========================================================
*/

function setStatus(
    state,
    message
) {

    statusPill.classList.remove(
        "connecting",
        "offline"
    );

    if (state === "connecting") {

        statusPill.classList.add("connecting");

    }

    if (state === "offline") {

        statusPill.classList.add("offline");

    }

    statusText.textContent = message;
}


/*
=========================================================
 GET SESSION TOKEN
=========================================================
*/

async function getSessionToken() {

    const response =
        await fetch(
            SUPABASE_FUNCTION_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({})
            }
        );

    const text =
        await response.text();

    let data;

    try {

        data = JSON.parse(text);

    } catch {

        throw new Error(
            "Supabase returned invalid JSON."
        );

    }

    if (!response.ok) {

        console.error(
            "Supabase error:",
            data
        );

        throw new Error(
            data.error ||
            data.details ||
            `Supabase HTTP ${response.status}`
        );

    }

    if (!data.success) {

        throw new Error(
            data.error ||
            "Unable to create Avatar session."
        );

    }

    if (!data.sessionToken) {

        throw new Error(
            "Supabase did not return sessionToken."
        );

    }

    return data.sessionToken;
}


/*
=========================================================
 START ANAM
=========================================================
*/

async function startAvatar() {

    if (isConnected) {
        return;
    }

    try {

        setStatus(
            "connecting",
            "Connecting..."
        );

        waveText.textContent =
            "Connecting to assistant...";

        startConversation.disabled = true;

        startConversation.textContent =
            "Connecting...";

        /*
         * Ask Supabase for a short-lived Anam token.
         */

        const sessionToken =
            await getSessionToken();

        console.log(
            "Anam session token received."
        );

        /*
         * Create Anam client.
         */

        anamClient =
            createClient(
                sessionToken,
                {
                    disableInputAudio: false,
                    voiceDetection: {
                        endOfSpeechSensitivity: 0.5
                    }
                }
            );

        /*
         * Session ready
         */

        anamClient.addListener(
            AnamEvent.SESSION_READY,
            () => {

                console.log(
                    "Anam session ready."
                );

                isConnected = true;

                setStatus(
                    "online",
                    "AI Assistant Online"
                );

                waveText.textContent =
                    "Listening...";

                startOverlay.classList.add(
                    "hidden"
                );

                avatarStage.classList.add(
                    "active"
                );

                avatarVideo.classList.remove(
                    "hidden"
                );

                startButton.classList.add(
                    "active"
                );

                endButton.disabled = false;

                startConversation.disabled = false;

                startConversation.textContent =
                    "Start Conversation";

            }
        );


        /*
         * Session started
         */

        anamClient.addListener(
            AnamEvent.SESSION_STARTED,
            () => {

                console.log(
                    "Anam session started."
                );

            }
        );


        /*
         * Errors
         */

        anamClient.addListener(
            AnamEvent.SESSION_ERROR,
            (error) => {

                console.error(
                    "Anam session error:",
                    error
                );

                showToast(
                    "Avatar connection error."
                );

                setStatus(
                    "offline",
                    "Connection error"
                );

            }
        );


        /*
         * Stream avatar video
         */

        await anamClient.streamToVideoElement(
            "avatar-video"
        );

        console.log(
            "Avatar video streaming."
        );

    } catch (error) {

        console.error(
            "START ERROR:",
            error
        );

        isConnected = false;

        setStatus(
            "offline",
            "Unable to connect"
        );

        waveText.textContent =
            "Connection failed";

        startConversation.disabled = false;

        startConversation.textContent =
            "🎙 Try Again";

        showToast(
            error.message ||
            "Unable to start conversation."
        );

    }

}


/*
=========================================================
 END SESSION
=========================================================
*/

async function endConversation() {

    try {

        if (
            anamClient &&
            anamClient.isStreaming()
        ) {

            await anamClient.stopStreaming();

        }

    } catch (error) {

        console.warn(
            "Stop error:",
            error
        );

    }

    anamClient = null;

    isConnected = false;

    startButton.classList.remove(
        "active"
    );

    endButton.disabled = true;

    avatarVideo.classList.add(
        "hidden"
    );

    avatarStage.classList.remove(
        "active"
    );

    setStatus(
        "offline",
        "Assistant Offline"
    );

    waveText.textContent =
        "Ready to talk";

    startOverlay.classList.remove(
        "hidden"
    );

}


/*
=========================================================
 MICROPHONE BUTTON
=========================================================
*/

startButton.addEventListener(
    "click",
    async () => {

        if (!isConnected) {

            await startAvatar();

        }

    }
);


/*
=========================================================
 START OVERLAY
=========================================================
*/

startConversation.addEventListener(
    "click",
    async () => {

        await startAvatar();

    }
);


/*
=========================================================
 END BUTTON
=========================================================
*/

endButton.addEventListener(
    "click",
    async () => {

        await endConversation();

    }
);


/*
=========================================================
 CLOSE BUTTON
=========================================================
*/

closeButton.addEventListener(
    "click",
    async () => {

        await endConversation();

    }
);


/*
=========================================================
 SPEAKER
=========================================================
*/

speakerButton.addEventListener(
    "click",
    () => {

        if (!isConnected) {

            showToast(
                "Start the conversation first."
            );

            return;

        }

        isMuted = !isMuted;

        /*
         * Do not mute the Anam WebRTC stream itself
         * by changing the video muted property unless
         * you intentionally want local playback muted.
         *
         * This button currently provides UI feedback.
         */

        if (isMuted) {

            speakerButton.textContent = "🔇";

            showToast(
                "Speaker muted"
            );

        } else {

            speakerButton.textContent = "🔊";

            showToast(
                "Speaker enabled"
            );

        }

    }
);


/*
=========================================================
 CHAT BUTTON
=========================================================
*/

chatButton.addEventListener(
    "click",
    () => {

        showToast(
            "Text chat can be added here."
        );

    }
);


/*
=========================================================
 QUICK ACTIONS
=========================================================
*/

document
    .querySelectorAll(".quick-action")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const message =
                        button.dataset.message;

                    /*
                     * For your current ElevenLabs +
                     * Anam server-side integration,
                     * microphone conversation is handled
                     * by the Anam session.
                     *
                     * These buttons are UI placeholders
                     * until you add an agent client-message
                     * mechanism.
                     */

                    showToast(
                        message
                    );

                }
            );

        }
    );


/*
=========================================================
 INITIAL STATE
=========================================================
*/

setStatus(
    "online",
    "AI Assistant Online"
);

avatarVideo.classList.add(
    "hidden"
);

console.log(
    "AvatarX initialized."
);

</script>

</body>
</html>
