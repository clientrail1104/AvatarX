<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Gemini Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-primary: #131314;
      --bg-secondary: #1e1f20;
      --bg-hover: #282a2c;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --border-color: #444746;
      --accent-gradient: linear-gradient(135deg, #4285f4, #9b51e0, #d93025);
      --card-bg: #1e1f20;
      --input-bg: #1e1f20;
      --sidebar-width: 280px;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f0f4f9;
      --bg-hover: #e1e5ea;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --border-color: #c4c7c5;
      --card-bg: #f0f4f9;
      --input-bg: #f0f4f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 68px;
      background-color: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 12px;
      transition: width 0.3s ease;
      z-index: 100;
    }

    .sidebar.expanded {
      width: var(--sidebar-width);
    }

    .sidebar-top, .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--bg-hover);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 28px;
      cursor: pointer;
      margin-top: 16px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar:not(.expanded) .new-chat-btn span:not(.material-symbols-outlined) {
      display: none;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
    }

    .header .title {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Chat View */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-bottom: 120px;
    }

    /* Welcome Container */
    .welcome-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .greeting-text {
      font-size: 56px;
      font-weight: 500;
      line-height: 1.2;
    }

    .gradient-text {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .suggestion-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 180px;
      transition: background 0.2s;
    }

    .card:hover {
      background-color: var(--bg-hover);
    }

    .card p {
      font-size: 14px;
      color: var(--text-primary);
    }

    .card .material-symbols-outlined {
      align-self: flex-end;
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 50%;
    }

    /* Chat Message Elements */
    .message {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.user .message-content {
      background-color: var(--bg-secondary);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 18px;
      max-width: 70%;
    }

    .message.model {
      justify-content: flex-start;
    }

    .message.model .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .message.model .message-content {
      max-width: 85%;
      line-height: 1.6;
    }

    pre {
      background-color: #000;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
    }

    code {
      font-family: monospace;
    }

    /* Input Dock */
    .input-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(180deg, transparent 0%, var(--bg-primary) 40%);
    }

    .input-box {
      width: 100%;
      max-width: 800px;
      background-color: var(--input-bg);
      border-radius: 28px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--border-color);
    }

    .input-box textarea {
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 16px;
      resize: none;
      max-height: 150px;
      height: 24px;
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-tools {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" id="menu-btn"><span class="material-symbols-outlined">menu</span></button>
      <button class="new-chat-btn" id="new-chat-btn">
        <span class="material-symbols-outlined">add</span>
        <span>New chat</span>
      </button>
    </div>
    <div class="sidebar-bottom">
      <button class="icon-btn" id="theme-btn"><span class="material-symbols-outlined">dark_mode</span></button>
      <button class="icon-btn"><span class="material-symbols-outlined">settings</span></button>
    </div>
  </aside>

  <!-- Main View -->
  <main class="main-content">
    <header class="header">
      <div class="title">Gemini</div>
      <button class="icon-btn"><span class="material-symbols-outlined">account_circle</span></button>
    </header>

    <div class="chat-container">
      <div class="chat-wrapper" id="chat-wrapper">
        
        <!-- Default Welcome View -->
        <div class="welcome-container" id="welcome-container">
          <div class="greeting-text">
            <span class="gradient-text">Hello, Dev</span><br>
            <span style="color: var(--text-secondary);">How can I help you today?</span>
          </div>

          <div class="suggestion-cards">
            <div class="card" onclick="sendSuggested('Suggest a quiet, scenic road trip itinerary')">
              <p>Suggest a quiet, scenic road trip itinerary</p>
              <span class="material-symbols-outlined">compass_calibration</span>
            </div>
            <div class="card" onclick="sendSuggested('Summarize the concept of urban planning')">
              <p>Summarize the concept of urban planning</p>
              <span class="material-symbols-outlined">draw</span>
            </div>
            <div class="card" onclick="sendSuggested('Provide Javascript code for an image carousel')">
              <p>Provide Javascript code for an image carousel</p>
              <span class="material-symbols-outlined">code</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Input Bar -->
    <div class="input-container">
      <div class="input-box">
        <textarea id="user-input" rows="1" placeholder="Ask Gemini..."></textarea>
        <div class="input-actions">
          <div class="input-tools">
            <button class="icon-btn"><span class="material-symbols-outlined">add_photo_alternate</span></button>
            <button class="icon-btn"><span class="material-symbols-outlined">mic</span></button>
          </div>
          <button class="icon-btn" id="send-btn"><span class="material-symbols-outlined">send</span></button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // System Configurations & State
    const API_KEY = "YOUR_GEMINI_API_KEY"; // Replace with your actual Google Gemini API Key
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menu-btn');
    const themeBtn = document.getElementById('theme-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatWrapper = document.getElementById('chat-wrapper');
    const welcomeContainer = document.getElementById('welcome-container');

    // UI Logic: Sidebar Toggle
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('expanded');
    });

    // UI Logic: Dark/Light Mode
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') !== 'light';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.querySelector('span').textContent = isDark ? 'light_mode' : 'dark_mode';
    });

    // UI Logic: Auto-expand Input Box
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
    });

    // Enter Key Handler
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    sendBtn.addEventListener('click', handleSendMessage);

    newChatBtn.addEventListener('click', () => {
      chatWrapper.innerHTML = '';
      chatWrapper.appendChild(welcomeContainer);
      welcomeContainer.style.display = 'flex';
    });

    function sendSuggested(text) {
      userInput.value = text;
      handleSendMessage();
    }

    // Message Rendering Engine
    async function handleSendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;

      // Hide landing page on first message
      welcomeContainer.style.display = 'none';

      // Clear & reset input
      userInput.value = '';
      userInput.style.height = '24px';

      // Append User Bubble
      appendMessage(prompt, 'user');

      // Append Empty Model Bubble for streaming
      const modelBubble = appendMessage("Thinking...", 'model');

      // Process API Call
      try {
        if (API_KEY === "YOUR_GEMINI_API_KEY") {
          // Mock response fallback if no API key set
          setTimeout(() => {
            modelBubble.innerHTML = marked.parse(`This is a mock Gemini response to: **"${prompt}"**.\n\nTo fetch real responses, add your free **Gemini API key** inside the HTML source code.`);
          }, 1000);
        } else {
          await fetchGeminiResponse(prompt, modelBubble);
        }
      } catch (err) {
        modelBubble.textContent = "Error: Could not retrieve response from Gemini API.";
        console.error(err);
      }
    }

    function appendMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;

      if (sender === 'user') {
        messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
      } else {
        messageDiv.innerHTML = `
          <div class="avatar"><span class="material-symbols-outlined" style="color:white; font-size: 20px;">sparkles</span></div>
          <div class="message-content">${marked.parse(text)}</div>
        `;
      }

      chatWrapper.appendChild(messageDiv);
      chatWrapper.scrollTop = chatWrapper.scrollHeight;
      return messageDiv.querySelector('.message-content');
    }

    // Direct Integration with Gemini REST API
    async function fetchGeminiResponse(prompt, targetElement) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
      
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        const replyText = data.candidates[0].content.parts[0].text;
        targetElement.innerHTML = marked.parse(replyText);
      } else {
        targetElement.textContent = "Unable to process response structure.";
      }
    }
  </script>
</body>
</html>
