<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ElevenLabs 3D Voice Avatar</title>
  <style>
    body { margin: 0; overflow: hidden; background: #121212; font-family: sans-serif; }
    #avatar-container { width: 100vw; height: 100vh; }
    #ui { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; }
    button { padding: 12px 24px; font-size: 16px; border-radius: 24px; border: none; background: #007aff; color: white; cursor: pointer; }
  </style>

  <!-- Import Three.js and ElevenLabs Client -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@elevenlabs/client": "https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="avatar-container"></div>
  <div id="ui">
    <button id="start-btn">Start Conversation</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { Conversation } from '@elevenlabs/client';

    let scene, camera, renderer, headMesh, audioAnalyser;
    let morphDict = {}, morphTargetInfluences = [];
    let conversation;

    // 1. Initialize Three.js Scene
    function initScene() {
      const container = document.getElementById('avatar-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.4, 0.8); // Focus on head & chest

      const light = new THREE.DirectionalLight(0xffffff, 1.5);
      light.position.set(0, 2, 2);
      scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Load Ready Player Me GLB
      const loader = new GLTFLoader();
      loader.load('https://models.readyplayer.me/64b0f9f3f33...glb', (gltf) => {
        const avatar = gltf.scene;
        scene.add(avatar);

        // Locating the head mesh containing facial morph targets
        avatar.traverse((child) => {
          if (child.isMesh && child.morphTargetDictionary) {
            if (child.morphTargetDictionary['viseme_aa'] !== undefined) {
              headMesh = child;
              morphDict = child.morphTargetDictionary;
              morphTargetInfluences = child.morphTargetInfluences;
            }
          }
        });
      });

      animate();
    }

    // 2. Animate Loop - Drive Morph Targets using Audio Amplitude / Visemes
    function animate() {
      requestAnimationFrame(animate);

      if (audioAnalyser && headMesh) {
        const dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
        audioAnalyser.getByteFrequencyData(dataArray);

        // Compute average volume level (0 to 1)
        const avgVolume = dataArray.reduce((a, b) => a + b, 0) / dataArray.length / 255;

        // Drive basic mouth opening (viseme_aa or mouthOpen morph target)
        if (morphDict['viseme_aa'] !== undefined) {
          // Smooth interpolation for fluid motion
          morphTargetInfluences[morphDict['viseme_aa']] = THREE.MathUtils.lerp(
            morphTargetInfluences[morphDict['viseme_aa']],
            avgVolume * 2.5,
            0.3
          );
        }
      }

      renderer.render(scene, camera);
    }

    // 3. Connect ElevenLabs Voicebot
    document.getElementById('start-btn').addEventListener('click', async () => {
      // Create Web Audio Analyser
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioAnalyser = audioCtx.createAnalyser();
      audioAnalyser.fftSize = 64;

      // Start ElevenLabs Conversation Session
      conversation = await Conversation.startSession({
        agentId: 'YOUR_ELEVENLABS_AGENT_ID', // Replace with your Agent ID
        onModeChange: (mode) => console.log('Agent Mode:', mode),
        onConnect: () => console.log('Connected to ElevenLabs'),
        onDisconnect: () => console.log('Disconnected'),
        onError: (err) => console.error(err),
      });

      // Hook Web Audio API into output stream to capture volume dynamics
      const audioStream = conversation.getAudioStream(); 
      if (audioStream) {
        const source = audioCtx.createMediaStreamSource(audioStream);
        source.connect(audioAnalyser);
      }
    });

    initScene();
  </script>
</body>
</html>
